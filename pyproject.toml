[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asd-mri-lab"
version = "0.1.0"
description = "基于 T1 MRI 的 ASD/HC 分类与医学图像预处理桌面软件"
readme = "PROJECT_README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "antspyx==0.6.3",
  "joblib>=1.4",
  "matplotlib>=3.10",
  "nibabel>=5.3",
  "nilearn>=0.12",
  "numpy>=2.0,<2.4",
  "pandas>=2.2",
  "PySide6==6.11.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.7",
  "scipy>=1.15",
  "torch>=2.7",
  "reportlab>=4",
  "pypdf>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
asd-mri = "asd_mri.cli:main"
asd-mri-gui = "asd_mri.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

